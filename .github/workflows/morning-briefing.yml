name: Morning briefing

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day
  workflow_dispatch:

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/pyproject.toml
      - run: pip install .
      - name: Build and save today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Image agent; it is skipped while these are not set.
          RECRAFT_API_KEY: ${{ secrets.RECRAFT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: newsagent --json briefing.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briefing
          path: agents/briefing.json
          if-no-files-found: ignore
